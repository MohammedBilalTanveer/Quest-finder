services:
  - type: web
    name: pokemon-quest-finder-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      # Set this in the Render dashboard to your Vercel URL, e.g. https://your-app.vercel.app
      # (no trailing slash; comma-separate several origins)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: USE_SAMPLE_DATA
        value: "0"
